[package]
name = "the-sacred-swirls"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3"
png = "=0.18.1"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
tss-live-wheel = { path = "../live-wheel" }
pollster = "0.3"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation","Win32_Graphics_Gdi","Win32_System_LibraryLoader","Win32_System_SystemInformation","Win32_UI_WindowsAndMessaging","Win32_UI_Input_KeyboardAndMouse"] }

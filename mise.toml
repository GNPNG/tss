[env]
RUSTUP_TOOLCHAIN = "1.88.0"

[tasks.dev]
description = "Run The Sacred Swirls desktop application"
run = "sh scripts/desktop-build.sh dev"
run_windows = "powershell -NoProfile -File scripts/desktop-build.ps1 dev"

[tasks.build]
description = "Build The Sacred Swirls desktop application"
run = "sh scripts/desktop-build.sh build"
run_windows = "powershell -NoProfile -File scripts/desktop-build.ps1 build"

[tasks.test]
description = "Run Rust tests"
run = "cargo test --locked --manifest-path src-tauri/Cargo.toml"

[tasks."performer:dev"]
description = "Build the compiled performance-surface listener beside the debug editor"
run = "go -C performer build -trimpath -o ../src-tauri/target/debug/ ."

[tasks."performer:release"]
description = "Build the compiled performance-surface listener beside the release editor"
run = "go -C performer build -trimpath -o ../src-tauri/target/release/ ."

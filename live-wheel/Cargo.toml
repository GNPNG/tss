[package]
name = "tss-live-wheel"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
wgpu = { version = "=0.19.4", features = ["spirv"] }
png = "=0.18.1"
flate2 = "1"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pollster = "0.3"

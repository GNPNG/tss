[package]
name = "tss-live-wheel"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
wgpu = { version = "=0.19.4", features = ["spirv"] }
png = "=0.18.1"
flate2 = "1"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pollster = "0.3"

[dependencies.lcms2]
version = "=6.3.0"
features = ["static"]

[dependencies.tiff]
version = "=0.11.3"
default-features = false
features = ["lzw"]

[dependencies.sha2]
version = "0.10"

[dependencies.pdf-writer]
version = "=0.15.0"

[dependencies.ttf-parser]
version = "=0.25.1"
default-features = false
features = ["std"]
